<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Todo List</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header>
  <h1>Todo List</h1>
  <button id="logout-btn" class="hidden">Sair</button>
</header>

<main>

  <section id="auth-section">
    <div class="auth-box">
      <div class="auth-tabs">
        <button id="tab-login" class="tab active">Entrar</button>
        <button id="tab-register" class="tab">Cadastrar</button>
      </div>

      <form id="login-form">
        <input type="text" id="login-username" placeholder="Usuário" required />
        <input type="password" id="login-password" placeholder="Senha" required />
        <button type="submit">Entrar</button>
        <p class="error" id="login-error"></p>
      </form>

      <form id="register-form" class="hidden">
        <input type="text" id="register-username" placeholder="Usuário" required />
        <input type="email" id="register-email" placeholder="E-mail" required />
        <input type="password" id="register-password" placeholder="Senha" required />
        <button type="submit">Cadastrar</button>
        <p class="error" id="register-error"></p>
      </form>
    </div>
  </section>

  <section id="tasks-section" class="hidden">

    <form id="task-form">
      <input type="text" id="task-title" placeholder="Título da tarefa" required />
      <textarea id="task-description" placeholder="Descrição (opcional)"></textarea>
      <div class="row">
        <select id="task-priority">
          <option value="low">Baixa</option>
          <option value="medium" selected>Média</option>
          <option value="high">Alta</option>
        </select>
        <input type="date" id="task-due-date" />
        <button type="submit">Adicionar tarefa</button>
      </div>
    </form>

    <div class="filters">
      <input type="text" id="filter-search" placeholder="Buscar por título..." />
      <select id="filter-status">
        <option value="">Todos os status</option>
        <option value="pending">Pendente</option>
        <option value="in_progress">Em andamento</option>
        <option value="done">Concluída</option>
      </select>
      <select id="filter-priority">
        <option value="">Todas as prioridades</option>
        <option value="low">Baixa</option>
        <option value="medium">Média</option>
        <option value="high">Alta</option>
      </select>
      <select id="filter-order">
        <option value="created_at">Mais recentes</option>
        <option value="due_date">Por prazo</option>
      </select>
    </div>

    <ul id="task-list"></ul>

  </section>

</main>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/tasks.js"></script>
</body>
</html>
